name: Align Gate 6C seed governance

on:
  push:
    branches:
      - gate-6c1-neural-contract
    paths:
      - ".github/workflows/align-gate-6c-seeds.yml"
      - "scripts/align_gate_6c_seed_governance.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: align-gate-6c-seeds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  align:
    name: Apply approved five-seed reconciliation
    runs-on: ubuntu-latest

    steps:
      - name: Check out governed branch
        uses: actions/checkout@v6
        with:
          ref: gate-6c1-neural-contract
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install migration dependency
        run: python -m pip install "PyYAML>=6.0,<7"

      - name: Apply approved seed alignment
        run: python scripts/align_gate_6c_seed_governance.py

      - name: Commit aligned Gate 6C1 artifacts
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Gate 6C seed governance is already aligned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            configs/neural_forecasting_contract.yml \
            schemas/neural_forecasting_contract.schema.json \
            schemas/neural_seed_evidence.schema.json \
            schemas/neural_candidate_evidence.schema.json \
            schemas/gate_6c1_closure_manifest.schema.json \
            outputs/v2/gate_6c1_closure_manifest.json \
            src/iaei/modeling/neural_governance.py \
            scripts/validate_gate_6c1.py \
            tests/test_neural_forecasting_governance.py \
            docs/GATE_6C_NEURAL_FORECASTING_PROTOCOL.md \
            docs/GATE_6C1_SCOPE_LOCK.md \
            docs/GATE_6C1_IMPLEMENTATION_CHECKLIST.md \
            docs/GATE_6C1_SEED_GOVERNANCE_RECONCILIATION.md \
            docs/GATE_6C1_IMPLEMENTATION_STATUS.md \
            .github/workflows/gate-6c1-neural-contract.yml
          git commit -m "Align Gate 6C with frozen five-seed governance"
          git push origin HEAD:gate-6c1-neural-contract
