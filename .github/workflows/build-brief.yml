name: Build technical brief

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-brief.yml"
      - "reports/latex/**"
      - "outputs/report_payload.json"
      - "outputs/charts/**"
      - "outputs/tables/**"
      - "outputs/modeling/locked_test_results.json"
      - "outputs/modeling/locked_test_closure_manifest.json"
  pull_request:
    paths:
      - ".github/workflows/build-brief.yml"
      - "reports/latex/**"
      - "outputs/report_payload.json"
      - "outputs/charts/**"
      - "outputs/tables/**"
      - "outputs/modeling/locked_test_results.json"
      - "outputs/modeling/locked_test_closure_manifest.json"
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    name: Compile governed LaTeX evidence brief
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Verify governed report payload
        run: |
          python scripts/build_report_payload.py
          git diff --exit-code -- outputs/report_payload.json

      - name: Verify approved figure identities
        shell: bash
        run: |
          set -euo pipefail
          echo "5bd81c6d72fa7f42de1a9fac341dd986d6d505293dcd39492d04bef9c0fdcb11  outputs/charts/confirmatory_forecasting_verdict.png" | sha256sum --check --strict
          echo "e121f57a84fb70266b62bae545bde5f9cfabc3330371eb23d1136f4dbe18dc04  outputs/charts/governed_data_architecture.png" | sha256sum --check --strict
          echo "b3836b2bf61d4a8dbaf9f16d2774ab8fd8509532ad619762a6761ddb415d453e  outputs/charts/model_ladder_chronological_validation.png" | sha256sum --check --strict
          echo "3770c9e100b607ca73af5b470d256d4beae088f95503afd44703d24663c92d46  outputs/charts/locked_test_temporal_stability.png" | sha256sum --check --strict
          echo "65446260ef8167a5d24493569fc32501abf5d4b10f40f72c35d7fc1f5d9c1c04  outputs/charts/evidence_governance_model_boundaries.png" | sha256sum --check --strict

      - name: Validate LaTeX source contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "reports/latex/"
              "industrial_adaptive_energy_intelligence_technical_brief.tex"
          )
          text = path.read_text(encoding="utf-8")

          required = (
              "Confirmatory forecasting verdict",
              "Governed data and analytical architecture",
              "Model ladder and chronological validation",
              "Locked-test stability and peak-state robustness",
              "Evidence governance and model boundaries",
              "27.6\\%",
              "22.6\\%",
              "35,040",
              "7,004",
              "761",
              "confirmatory_forecasting_verdict.png",
              "governed_data_architecture.png",
              "model_ladder_chronological_validation.png",
              "locked_test_temporal_stability.png",
              "evidence_governance_model_boundaries.png",
              "pdfauthor={Industrial Adaptive Energy Intelligence}",
          )
          prohibited = (
              "gerdau",
              "rodolfo pereira",
              "placeholder",
              "populate_",
              "todo",
              "tbd",
              "dummy",
              "synthetic",
              "guaranteed savings",
              "production ready",
          )

          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f"Missing governed LaTeX fragments: {missing}")

          if text.count("\\newpage") != 4:
              raise SystemExit("The report source must contain exactly four page breaks")

          lowered = text.lower()
          found = [value for value in prohibited if value in lowered]
          if found:
              raise SystemExit(f"Prohibited public content detected: {found}")

          print("LaTeX source contract: PASS")
          PY

      - name: Compile governed LaTeX brief
        uses: xu-cheng/latex-action@v4
        with:
          root_file: industrial_adaptive_energy_intelligence_technical_brief.tex
          working_directory: reports/latex
          texlive_version: 2025
          os: debian
          compiler: latexmk
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Validate compiled PDF
        shell: bash
        run: |
          set -euo pipefail
          PDF="reports/latex/industrial_adaptive_energy_intelligence_technical_brief.pdf"
          test -s "$PDF"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdfinfo "$PDF" > reports/latex/pdfinfo.txt
          grep -Eq '^Pages:[[:space:]]+5$' reports/latex/pdfinfo.txt
          grep -Eq '^Title:.*Industrial Adaptive Energy Intelligence' reports/latex/pdfinfo.txt
          grep -Eq '^Author:.*Industrial Adaptive Energy Intelligence' reports/latex/pdfinfo.txt
          test "$(stat -c%s "$PDF")" -gt 100000
          sha256sum "$PDF" | tee reports/latex/pdf.sha256

      - name: Upload governed report package
        uses: actions/upload-artifact@v4
        with:
          name: industrial-adaptive-energy-intelligence-technical-brief
          path: |
            reports/latex/industrial_adaptive_energy_intelligence_technical_brief.pdf
            reports/latex/industrial_adaptive_energy_intelligence_technical_brief.tex
            reports/latex/README.md
            reports/latex/pdfinfo.txt
            reports/latex/pdf.sha256
            outputs/report_payload.json
            outputs/charts/*.png
            outputs/tables/*.csv
          if-no-files-found: error
          retention-days: 90

      - name: Attach PDF to published GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload \
            "${{ github.event.release.tag_name }}" \
            reports/latex/industrial_adaptive_energy_intelligence_technical_brief.pdf \
            --clobber
