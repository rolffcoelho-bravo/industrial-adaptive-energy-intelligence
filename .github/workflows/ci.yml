name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality and foundation validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: |
          python -m ruff --version
          python -m ruff check src scripts tests

      - name: Verify immutable V1 release boundary
        run: python scripts/verify_v1_immutability.py

      - name: Verify governed raw snapshot
        run: python scripts/download_data.py --verify

      - name: Build governed Silver analytical layer
        run: python scripts/run_pipeline.py --silver

      - name: Run tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          python -W error::DeprecationWarning -m pytest -q 2>&1 | tee "${RUNNER_TEMP}/pytest.log"

      - name: Upload test diagnostic on failure
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ci-pytest-diagnostic
          path: ${{ runner.temp }}/pytest.log
          if-no-files-found: error
          retention-days: 14

      - name: Validate repository foundation
        run: python scripts/run_pipeline.py --check
