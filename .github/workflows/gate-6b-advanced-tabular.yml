name: Execute Gate 6B advanced tabular challengers

on:
  pull_request:
    paths:
      - ".github/workflows/gate-6b-advanced-tabular.yml"
      - "configs/advanced_tabular_contract.yml"
      - "configs/search_spaces/gate_6b_*.json"
      - "schemas/advanced_tabular_contract.schema.json"
      - "src/iaei/v2/**"
      - "src/iaei/contracts.py"
      - "scripts/run_gate_6b_advanced_tabular.py"
      - "scripts/validate_gate_6b_evidence.py"
      - "tests/test_advanced_tabular_governance.py"
      - "pyproject.toml"
      - "outputs/v2/gate_6b/**"
      - "docs/GATE_6B_*.md"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gate-6b-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  execute:
    name: Governed advanced tabular validation
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install governed execution environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,v2-tabular]"

      - name: Apply bounded chronology-key correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/iaei/v2/advanced_tabular.py")
          text = path.read_text(encoding="utf-8")
          old = 'fold_payload["test_start"]'
          new = 'fold_payload["locked_test_start"]'
          count = text.count(old)
          if count == 1:
              path.write_text(text.replace(old, new), encoding="utf-8")
              print("Corrected the single frozen-chronology key reference.")
          elif count == 0 and new in text:
              print("Frozen-chronology key reference is already correct.")
          else:
              raise SystemExit(
                  f"Unexpected chronology-key state: old_count={count}, new_present={new in text}"
              )
          PY

      - name: Validate source, contracts, and immutable V1 boundary
        run: |
          python -m ruff --version
          python -m ruff check src scripts tests
          python scripts/verify_v1_immutability.py
          python -m pytest tests/test_contracts.py tests/test_v2_governance.py tests/test_advanced_tabular_governance.py -q
          python scripts/audit_public_content.py

      - name: Prepare governed analytical data
        run: |
          python scripts/download_data.py --verify
          python scripts/run_pipeline.py --silver

      - name: Execute Gate 6B when evidence is absent
        id: execute
        shell: bash
        run: |
          set -uo pipefail
          MANIFEST="outputs/v2/gate_6b/gate_6b_execution_manifest.json"
          DIAGNOSTIC="${RUNNER_TEMP}/gate_6b_execution.log"
          if [ -f "$MANIFEST" ]; then
            echo "executed=false" >> "$GITHUB_OUTPUT"
            echo "Committed Gate 6B evidence already exists. Execution skipped."
          else
            set +e
            python scripts/run_gate_6b_advanced_tabular.py > "$DIAGNOSTIC" 2>&1
            status=$?
            set -e
            cat "$DIAGNOSTIC"
            if [ "$status" -ne 0 ]; then
              exit "$status"
            fi
            echo "executed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload bounded execution diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-6b-execution-diagnostic
          path: ${{ runner.temp }}/gate_6b_execution.log
          if-no-files-found: error
          retention-days: 14

      - name: Validate Gate 6B evidence
        run: python scripts/validate_gate_6b_evidence.py

      - name: Publish validation summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          import pandas as pd

          root = Path("outputs/v2/gate_6b")
          leaderboard = pd.read_csv(root / "candidate_leaderboard.csv")
          manifest = json.loads(
              (root / "gate_6b_execution_manifest.json").read_text(encoding="utf-8")
          )

          print("## Gate 6B validation evidence")
          print()
          print("| Candidate | Mean MAE | Mean peak MAE | Relative MAE improvement | Positive folds | Pareto | Promotion eligible |")
          print("|---|---:|---:|---:|---:|---|---|")
          for row in leaderboard.itertuples(index=False):
              print(
                  f"| {row.algorithm_id} | {row.mean_mae:.6f} | "
                  f"{row.mean_peak_mae:.6f} | "
                  f"{row.mean_validation_mae_relative_improvement:.2%} | "
                  f"{row.positive_outer_folds} | {row.pareto_status} | "
                  f"{bool(row.promotion_eligible)} |"
              )
          print()
          print(f"Recommendation: `{manifest['recommendation']['recommendation']}`")
          print()
          print("This is validation evidence only. Human promotion approval remains required.")
          PY

      - name: Commit first execution evidence to the pull-request branch
        if: steps.execute.outputs.executed == 'true' && github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/iaei/v2/advanced_tabular.py outputs/v2/gate_6b
          git commit -m "Record Gate 6B validation evidence"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Upload complete Gate 6B evidence package
        uses: actions/upload-artifact@v4
        with:
          name: gate-6b-advanced-tabular-validation
          path: outputs/v2/gate_6b
          if-no-files-found: error
          retention-days: 90
