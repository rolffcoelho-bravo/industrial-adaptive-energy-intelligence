name: Execute Gate 6C neural forecasting

on:
  pull_request:
    paths:
      - ".github/workflows/gate-6c-neural-forecasting.yml"
      - "configs/neural_forecasting_contract.yml"
      - "configs/search_spaces/gate_6c_*.json"
      - "schemas/neural_forecasting_contract.schema.json"
      - "src/iaei/v2/neural_forecasting.py"
      - "src/iaei/contracts.py"
      - "scripts/run_gate_6c_neural_forecasting.py"
      - "scripts/validate_gate_6c_evidence.py"
      - "tests/test_neural_forecasting_governance.py"
      - "pyproject.toml"
      - "outputs/v2/gate_6c/**"
      - "docs/GATE_6C_*.md"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gate-6c-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  execute:
    name: Governed neural forecasting validation
    runs-on: ubuntu-latest
    timeout-minutes: 720

    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install governed CPU execution environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,v2-neural]"

      - name: Apply bounded portability-scale correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/iaei/v2/neural_forecasting.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  ") -> tuple[Any, np.ndarray, float, float]:",
                  ") -> tuple[Any, np.ndarray, float, float, float]:",
              ),
              (
                  "    return model, prediction, wall_clock, target_scale",
                  "    return model, prediction, wall_clock, target_mean, target_scale",
              ),
              (
                  "    reference_prediction: np.ndarray,\n    batch_size: int,\n) -> int:",
                  "    reference_prediction: np.ndarray,\n    target_mean: float,\n    target_scale: float,\n    batch_size: int,\n) -> int:",
              ),
              (
                  "        observed = _predict(restored, static[:count], sequence[:count], batch_size=batch_size)",
                  "        observed = (\n            _predict(\n                restored,\n                static[:count],\n                sequence[:count],\n                batch_size=batch_size,\n            )\n            * target_scale\n            + target_mean\n        )",
              ),
              (
                  "            _, prediction, wall_clock, _ = _fit_model(",
                  "            _, prediction, wall_clock, _, _ = _fit_model(",
              ),
              (
                  "        model, prediction, wall_clock, target_scale = _fit_model(",
                  "        model, prediction, wall_clock, target_mean, target_scale = _fit_model(",
              ),
              (
                  "            reference_prediction=prediction,\n            batch_size=int(contract[\"training\"][\"batch_size\"]),",
                  "            reference_prediction=prediction,\n            target_mean=target_mean,\n            target_scale=target_scale,\n            batch_size=int(contract[\"training\"][\"batch_size\"]),",
              ),
          ]

          changed = False
          for old, new in replacements:
              old_count = text.count(old)
              if old_count == 1:
                  text = text.replace(old, new)
                  changed = True
              elif old_count == 0 and new in text:
                  continue
              else:
                  raise SystemExit(
                      f"Unexpected portability-correction state for fragment: {old[:80]!r}; "
                      f"old_count={old_count}, new_present={new in text}"
                  )

          if changed:
              path.write_text(text, encoding="utf-8")
              print("Applied the bounded target-scale portability correction.")
          else:
              print("Target-scale portability correction is already present.")
          PY

      - name: Validate source, contracts, predecessors, and immutable V1 boundary
        id: validate_source
        shell: bash
        run: |
          set -uo pipefail
          DIAGNOSTIC="${RUNNER_TEMP}/gate_6c_validation.log"
          set +e
          {
            python -m ruff --version
            python -m ruff check src scripts tests
            python scripts/verify_v1_immutability.py
            python scripts/validate_gate_6b_evidence.py
            python -m pytest tests/test_contracts.py tests/test_v2_governance.py tests/test_advanced_tabular_governance.py tests/test_neural_forecasting_governance.py -q
            python scripts/audit_public_content.py
          } > "$DIAGNOSTIC" 2>&1
          status=$?
          set -e
          cat "$DIAGNOSTIC"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Upload bounded validation diagnostic
        if: failure() && steps.validate_source.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gate-6c-validation-diagnostic
          path: ${{ runner.temp }}/gate_6c_validation.log
          if-no-files-found: error
          retention-days: 14

      - name: Prepare governed analytical data
        run: |
          python scripts/download_data.py --verify
          python scripts/run_pipeline.py --silver

      - name: Execute Gate 6C when evidence is absent or portability evidence is defective
        id: execute
        shell: bash
        run: |
          set -uo pipefail
          MANIFEST="outputs/v2/gate_6c/gate_6c_execution_manifest.json"
          LEADERBOARD="outputs/v2/gate_6c/candidate_leaderboard.csv"
          DIAGNOSTIC="${RUNNER_TEMP}/gate_6c_execution.log"
          reexecute=false

          if [ ! -f "$MANIFEST" ]; then
            reexecute=true
            echo "No committed Gate 6C evidence exists. Execution required."
          elif [ ! -f "$LEADERBOARD" ]; then
            reexecute=true
            echo "Gate 6C leaderboard is missing. Execution required."
          elif python - <<'PY'
          import pandas as pd
          frame = pd.read_csv("outputs/v2/gate_6c/candidate_leaderboard.csv")
          failures = int(frame["portability_failure_count"].sum())
          raise SystemExit(0 if failures > 0 else 1)
          PY
          then
            reexecute=true
            echo "Existing evidence contains the known target-scale portability defect. Reexecution required."
          else
            echo "executed=false" >> "$GITHUB_OUTPUT"
            echo "Committed Gate 6C evidence is complete. Execution skipped."
          fi

          if [ "$reexecute" = true ]; then
            set +e
            python scripts/run_gate_6c_neural_forecasting.py > "$DIAGNOSTIC" 2>&1
            status=$?
            set -e
            cat "$DIAGNOSTIC"
            if [ "$status" -ne 0 ]; then
              exit "$status"
            fi
            echo "executed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload bounded execution diagnostic
        if: failure() && steps.execute.outputs.executed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gate-6c-execution-diagnostic
          path: ${{ runner.temp }}/gate_6c_execution.log
          if-no-files-found: error
          retention-days: 14

      - name: Validate Gate 6C evidence
        run: python scripts/validate_gate_6c_evidence.py

      - name: Publish validation summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          import pandas as pd

          root = Path("outputs/v2/gate_6c")
          leaderboard = pd.read_csv(root / "candidate_leaderboard.csv")
          manifest = json.loads(
              (root / "gate_6c_execution_manifest.json").read_text(encoding="utf-8")
          )

          print("## Gate 6C neural validation evidence")
          print()
          print("| Candidate | Mean MAE | Seed SD | Peak MAE | Relative MAE improvement | Positive folds | Pareto | Promotion eligible |")
          print("|---|---:|---:|---:|---:|---:|---|---|")
          for row in leaderboard.itertuples(index=False):
              print(
                  f"| {row.algorithm_id} | {row.mean_mae:.6f} | "
                  f"{row.across_seed_mae_standard_deviation:.6f} | "
                  f"{row.mean_peak_mae:.6f} | "
                  f"{row.mean_validation_mae_relative_improvement:.2%} | "
                  f"{row.positive_outer_folds} | {row.pareto_status} | "
                  f"{bool(row.promotion_eligible)} |"
              )
          print()
          print(f"Recommendation: `{manifest['recommendation']['recommendation']}`")
          print()
          print("This is validation evidence only. Human promotion approval remains required.")
          PY

      - name: Commit first or corrected execution evidence to the pull-request branch
        if: steps.execute.outputs.executed == 'true' && github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/iaei/v2/neural_forecasting.py outputs/v2/gate_6c
          git commit -m "Record corrected Gate 6C neural validation evidence"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Upload complete Gate 6C evidence package
        uses: actions/upload-artifact@v4
        with:
          name: gate-6c-neural-forecasting-validation
          path: outputs/v2/gate_6c
          if-no-files-found: error
          retention-days: 90
