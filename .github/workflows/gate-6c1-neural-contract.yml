name: Validate Gate 6C1 neural implementation boundary

on:
  pull_request:
    paths:
      - ".github/workflows/gate-6c1-neural-contract.yml"
      - "configs/neural_forecasting_contract.yml"
      - "schemas/neural_*.schema.json"
      - "schemas/gate_6c1_closure_manifest.schema.json"
      - "src/iaei/contracts.py"
      - "src/iaei/modeling/**"
      - "scripts/validate_gate_6c1.py"
      - "tests/test_neural_forecasting_governance.py"
      - "outputs/v2/gate_6c1_closure_manifest.json"
      - "docs/GATE_6C*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-6c1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Governed neural implementation validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Validate quality and frozen evidence boundaries
        id: validate
        shell: bash
        run: |
          set -o pipefail
          DIAGNOSTIC="${RUNNER_TEMP}/gate_6c1_validation.log"
          {
            python -m ruff --version
            python -m ruff check src scripts tests
            python scripts/verify_v1_immutability.py
            python scripts/validate_gate_6b_closure.py
            python -m pytest \
              tests/test_contracts.py \
              tests/test_v2_governance.py \
              tests/test_advanced_tabular_governance.py \
              tests/test_gate_6b_closure.py \
              tests/test_neural_forecasting_governance.py \
              -q
            python scripts/validate_gate_6c1.py
            python scripts/audit_public_content.py
          } 2>&1 | tee "$DIAGNOSTIC"

      - name: Upload validation diagnostic on failure
        if: failure() && steps.validate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gate-6c1-validation-diagnostic
          path: ${{ runner.temp }}/gate_6c1_validation.log
          if-no-files-found: error
          retention-days: 14

      - name: Publish Gate 6C1 summary
        shell: bash
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Gate 6C1 implementation boundary

          - Candidate families: compact N-HiTS, compact TiDE, compact PatchTST
          - Configurations: 3 total, one per family
          - Seeds: 20260725, 20260726, 20260727
          - Canonical device: CPU
          - Model fitting: not permitted
          - Validation predictions: not generated
          - Locked-test access: not permitted
          - Confirmatory evaluation: not permitted
          - Automatic promotion: not permitted
          - Next subgate after formal closure: Gate 6C2
          EOF
