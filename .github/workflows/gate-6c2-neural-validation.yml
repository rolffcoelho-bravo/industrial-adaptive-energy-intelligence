name: Execute Gate 6C2 governed neural validation

on:
  pull_request:
    paths:
      - ".github/workflows/gate-6c2-neural-validation.yml"
      - "pyproject.toml"
      - "configs/neural_forecasting_contract.yml"
      - "schemas/neural_*.schema.json"
      - "src/iaei/v2/neural_*.py"
      - "scripts/run_gate_6c2_neural.py"
      - "scripts/validate_gate_6c2_evidence.py"
      - "scripts/validate_gate_6c1.py"
      - "tests/test_gate_6c2_neural_execution.py"
      - "outputs/v2/gate_6c/**"
      - "docs/GATE_6C2_*.md"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gate-6c2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  execute:
    name: Governed neural forecasting validation
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install governed neural environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,v2-neural]"

      - name: Validate contracts, source, and frozen boundaries
        id: validate
        shell: bash
        run: |
          set +e
          DIAGNOSTIC="${RUNNER_TEMP}/gate_6c2_validation.log"
          {
            python -m ruff --version
            python -m ruff check src scripts tests
            python scripts/verify_v1_immutability.py
            python scripts/validate_gate_6b_closure.py
            python scripts/validate_gate_6c1.py
            python -m pytest \
              tests/test_contracts.py \
              tests/test_v2_governance.py \
              tests/test_neural_forecasting_governance.py \
              tests/test_gate_6c2_neural_execution.py \
              -q
            python scripts/audit_public_content.py
          } > "$DIAGNOSTIC" 2>&1
          status=$?
          cat "$DIAGNOSTIC"
          exit "$status"

      - name: Upload bounded validation diagnostic
        if: failure() && steps.validate.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gate-6c2-validation-diagnostic
          path: ${{ runner.temp }}/gate_6c2_validation.log
          if-no-files-found: error
          retention-days: 14

      - name: Prepare governed analytical data
        run: |
          python scripts/download_data.py --verify
          python scripts/run_pipeline.py --silver

      - name: Execute Gate 6C2 when evidence is absent
        id: execute
        shell: bash
        run: |
          set -uo pipefail
          MANIFEST="outputs/v2/gate_6c/gate_6c_execution_manifest.json"
          DIAGNOSTIC="${RUNNER_TEMP}/gate_6c2_execution.log"
          if [ -f "$MANIFEST" ]; then
            echo "executed=false" >> "$GITHUB_OUTPUT"
            echo "Committed Gate 6C2 evidence already exists. Execution skipped."
          else
            set +e
            python scripts/run_gate_6c2_neural.py > "$DIAGNOSTIC" 2>&1
            status=$?
            set -e
            cat "$DIAGNOSTIC"
            if [ "$status" -ne 0 ]; then
              exit "$status"
            fi
            echo "executed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload bounded execution diagnostic
        if: failure() && steps.execute.outputs.executed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gate-6c2-execution-diagnostic
          path: ${{ runner.temp }}/gate_6c2_execution.log
          if-no-files-found: error
          retention-days: 14

      - name: Validate complete Gate 6C2 evidence
        run: |
          python scripts/validate_gate_6c1.py
          python scripts/validate_gate_6c2_evidence.py
          python scripts/verify_v1_immutability.py
          python scripts/audit_public_content.py

      - name: Publish governed neural summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          import pandas as pd

          root = Path("outputs/v2/gate_6c")
          leaderboard = pd.read_csv(root / "candidate_leaderboard.csv")
          recommendation = json.loads(
              (root / "promotion_recommendation.json").read_text(encoding="utf-8")
          )
          manifest = json.loads(
              (root / "gate_6c_execution_manifest.json").read_text(encoding="utf-8")
          )

          print("## Gate 6C2 governed neural validation")
          print()
          print("| Candidate | Mean MAE | Mean peak MAE | MAE improvement | Peak change | Seed MAE SD | Positive folds | Pareto | Eligible |")
          print("|---|---:|---:|---:|---:|---:|---:|---|---|")
          for row in leaderboard.itertuples(index=False):
              print(
                  f"| {row.algorithm_id} | {row.mean_mae:.6f} | "
                  f"{row.mean_peak_mae:.6f} | "
                  f"{row.relative_mae_improvement_vs_v1:.2%} | "
                  f"{row.relative_peak_mae_change_vs_v1:.2%} | "
                  f"{row.across_seed_mae_standard_deviation:.6f} | "
                  f"{row.positive_outer_folds} | "
                  f"{bool(row.pareto_eligible)} | "
                  f"{bool(row.promotion_eligible)} |"
              )
          print()
          print(f"Seed-fold evaluations: `{manifest['seed_fold_evaluation_count']}`")
          print(f"Prediction rows: `{manifest['prediction_row_count']}`")
          print(f"Eligible candidates: `{recommendation['eligible_candidates']}`")
          print(f"Next gate: `{manifest['next_gate']}`")
          print()
          print("Validation evidence only. Human promotion authority remains required.")
          PY

      - name: Commit first Gate 6C2 evidence to the pull-request branch
        if: steps.execute.outputs.executed == 'true' && github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/v2/gate_6c
          git commit -m "Record Gate 6C2 governed neural validation evidence"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Upload complete Gate 6C2 evidence package
        uses: actions/upload-artifact@v4
        with:
          name: gate-6c2-governed-neural-validation
          path: outputs/v2/gate_6c
          if-no-files-found: error
          retention-days: 90
