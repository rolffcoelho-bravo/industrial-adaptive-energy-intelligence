name: Validate Gate 6C3 neural closure

on:
  pull_request:
    paths:
      - ".github/workflows/gate-6c3-neural-closure.yml"
      - "schemas/gate_6c3_human_decision.schema.json"
      - "schemas/gate_6c_closure_manifest.schema.json"
      - "outputs/v2/gate_6c/promotion_decision.json"
      - "outputs/v2/gate_6c/gate_6c_closure_manifest.json"
      - "scripts/validate_gate_6c3_closure.py"
      - "tests/test_gate_6c3_closure.py"
      - "docs/GATE_6C3_NEURAL_FORECASTING_CLOSURE.md"
      - "docs/ROADMAP.md"
      - "docs/DECISION_GATES.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure:
    name: Governed neural promotion decision and closure
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Validate Gate 6C closure and immutable boundaries
        id: validate
        shell: bash
        run: |
          set +e
          DIAGNOSTIC="${RUNNER_TEMP}/gate_6c3_validation.log"
          {
            python -m ruff --version
            python -m ruff check src scripts tests
            python scripts/verify_v1_immutability.py
            python scripts/validate_gate_6b_closure.py
            python scripts/validate_gate_6c1.py
            python scripts/validate_gate_6c2_evidence.py
            python scripts/validate_gate_6c3_closure.py
            python -m pytest \
              tests/test_contracts.py \
              tests/test_v2_governance.py \
              tests/test_neural_forecasting_governance.py \
              tests/test_gate_6c2_neural_execution.py \
              tests/test_gate_6c3_closure.py \
              -q
            python scripts/audit_public_content.py
          } > "$DIAGNOSTIC" 2>&1
          status=$?
          cat "$DIAGNOSTIC"
          exit "$status"

      - name: Upload bounded closure diagnostic
        if: failure() && steps.validate.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gate-6c3-closure-diagnostic
          path: ${{ runner.temp }}/gate_6c3_validation.log
          if-no-files-found: error
          retention-days: 14

      - name: Publish Gate 6C closure summary
        shell: bash
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Gate 6C3 neural forecasting closure

          - Compact N-HiTS: rejected
          - Compact TiDE: rejected
          - Compact PatchTST: rejected
          - Retained model: `v1_frozen_champion`
          - Locked-test access: `false`
          - Confirmatory evaluation: `false`
          - V1 immutable: `true`
          - Gate 6C status: `closed`
          - Next permitted gate: `6D`
          EOF
