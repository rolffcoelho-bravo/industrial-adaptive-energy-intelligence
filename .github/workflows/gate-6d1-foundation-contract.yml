name: Validate Gate 6D1 foundation-model contract

on:
  pull_request:
    paths:
      - ".github/workflows/gate-6d1-foundation-contract.yml"
      - "configs/foundation_model_contract.yml"
      - "schemas/foundation_model_contract.schema.json"
      - "schemas/gate_6d1_closure_manifest.schema.json"
      - "outputs/v2/gate_6d1_closure_manifest.json"
      - "src/iaei/foundation_contracts.py"
      - "src/iaei/modeling/foundation_governance.py"
      - "scripts/validate_gate_6d1.py"
      - "tests/test_foundation_model_governance.py"
      - "docs/GATE_6D_FOUNDATION_MODEL_PROTOCOL.md"
      - "docs/GATE_6D1_SCOPE_LOCK.md"
      - "docs/ROADMAP.md"
      - "docs/DECISION_GATES.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Foundation-model identity and governance lock
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Validate Gate 6D1 contracts and frozen boundaries
        id: validate
        shell: bash
        run: |
          set +e
          DIAGNOSTIC="${RUNNER_TEMP}/gate_6d1_validation.log"
          {
            python -m ruff --version
            python -m ruff check src scripts tests
            python scripts/verify_v1_immutability.py
            python scripts/validate_gate_6b_closure.py
            python scripts/validate_gate_6c3_closure.py
            python scripts/validate_gate_6d1.py
            python -m pytest \
              tests/test_contracts.py \
              tests/test_v2_governance.py \
              tests/test_neural_forecasting_governance.py \
              tests/test_gate_6c3_closure.py \
              tests/test_foundation_model_governance.py \
              -q
            python scripts/audit_public_content.py
          } > "$DIAGNOSTIC" 2>&1
          status=$?
          cat "$DIAGNOSTIC"
          exit "$status"

      - name: Upload bounded validation diagnostic
        if: failure() && steps.validate.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gate-6d1-validation-diagnostic
          path: ${{ runner.temp }}/gate_6d1_validation.log
          if-no-files-found: error
          retention-days: 14

      - name: Publish Gate 6D1 summary
        shell: bash
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Gate 6D1 foundation-model contract lock

          - Chronos-2: zero-shot benchmark, Apache-2.0, promotion eligible
          - TimesFM 2.5: zero-shot benchmark, Apache-2.0, promotion eligible
          - Moirai 2.0: research-only benchmark, CC-BY-NC-4.0, promotion prohibited
          - Common context: 672 intervals
          - Forecast horizon: one interval
          - Model downloads: false
          - Model inference: false
          - Locked-test access: false
          - Automatic promotion: false
          - V1 immutable: true
          - Gate 6D2: separate authorization required
          EOF
