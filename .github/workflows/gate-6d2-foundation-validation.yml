name: Execute Gate 6D2 foundation-model validation

on:
  pull_request:
    paths:
      - ".github/workflows/gate-6d2-foundation-validation.yml"
      - "configs/foundation_model_contract.yml"
      - "schemas/foundation_*.schema.json"
      - "src/iaei/foundation_contracts.py"
      - "src/iaei/v2/foundation_*.py"
      - "scripts/run_gate_6d2_candidate.py"
      - "scripts/build_gate_6d2_evidence.py"
      - "scripts/validate_gate_6d2_evidence.py"
      - "tests/test_gate_6d2_foundation_execution.py"
      - "outputs/v2/gate_6d/**"
      - "docs/GATE_6D2_*.md"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gate-6d2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  execute:
    name: Governed zero-shot foundation-model validation
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_XET: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
      PYTHONHASHSEED: "20260727"

    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install governance environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Validate implementation and frozen predecessors
        id: preflight
        shell: bash
        run: |
          set +e
          DIAGNOSTIC="${RUNNER_TEMP}/gate_6d2_preflight.log"
          (
            set -e
            python -m ruff check src scripts tests
            python scripts/verify_v1_immutability.py
            python scripts/validate_gate_6c3_closure.py
            python scripts/validate_gate_6d1.py
            python scripts/validate_gate_6d2_evidence.py
            python -m pytest \
              tests/test_contracts.py \
              tests/test_v2_governance.py \
              tests/test_gate_6c3_closure.py \
              tests/test_foundation_model_governance.py \
              tests/test_gate_6d2_foundation_execution.py \
              -q
            python scripts/audit_public_content.py
          ) > "$DIAGNOSTIC" 2>&1
          status=$?
          cat "$DIAGNOSTIC"
          exit "$status"

      - name: Upload bounded preflight diagnostic
        if: failure() && steps.preflight.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gate-6d2-preflight-diagnostic
          path: ${{ runner.temp }}/gate_6d2_preflight.log
          if-no-files-found: error
          retention-days: 14

      - name: Prepare governed analytical data
        run: |
          python scripts/download_data.py --verify
          python scripts/run_pipeline.py --silver

      - name: Execute Gate 6D2 when evidence is absent
        id: execute
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="outputs/v2/gate_6d/gate_6d_execution_manifest.json"
          STAGING="${RUNNER_TEMP}/gate_6d2"
          DIAGNOSTIC="${RUNNER_TEMP}/gate_6d2_execution.log"
          if [ -f "$MANIFEST" ]; then
            echo "executed=false" >> "$GITHUB_OUTPUT"
            echo "Committed Gate 6D2 evidence already exists. Execution skipped."
            exit 0
          fi

          echo "executed=true" >> "$GITHUB_OUTPUT"
          mkdir -p "$STAGING/candidates" "$STAGING/model_cache"
          exec > >(tee "$DIAGNOSTIC") 2>&1

          create_common_environment() {
            local venv="$1"
            python -m venv "$venv"
            "$venv/bin/python" -m pip install --upgrade pip setuptools wheel
            "$venv/bin/python" -m pip install \
              "PyYAML==6.0.3" \
              "jsonschema==4.25.1" \
              "huggingface-hub==0.36.0" \
              "safetensors==0.6.2"
          }

          run_chronos() {
            local venv="$STAGING/venv-chronos"
            create_common_environment "$venv"
            "$venv/bin/python" -m pip install \
              --index-url https://download.pytorch.org/whl/cpu \
              "torch==2.7.1"
            "$venv/bin/python" -m pip install \
              "numpy==2.3.3" \
              "pandas==2.3.3" \
              "pyarrow==21.0.0" \
              "transformers==4.57.1" \
              "accelerate==1.11.0" \
              "einops==0.8.1"
            "$venv/bin/python" -m pip install --no-deps \
              "git+https://github.com/amazon-science/chronos-forecasting.git@7dc4435706a4454feb79df44ca9f33631f3027bf"
            "$venv/bin/python" -m pip install -e . --no-deps
            "$venv/bin/python" scripts/run_gate_6d2_candidate.py \
              --candidate-id chronos_2_zero_shot \
              --staging-root "$STAGING"
            rm -rf "$venv" "$STAGING/model_cache/chronos_2_zero_shot"
          }

          run_timesfm() {
            local venv="$STAGING/venv-timesfm"
            create_common_environment "$venv"
            "$venv/bin/python" -m pip install \
              --index-url https://download.pytorch.org/whl/cpu \
              "torch==2.7.1"
            "$venv/bin/python" -m pip install \
              "numpy==2.3.3" \
              "pandas==2.3.3" \
              "pyarrow==21.0.0"
            "$venv/bin/python" -m pip install --no-deps \
              "git+https://github.com/google-research/timesfm.git@3dae50b20d7a724981e8ea36cda75578f80dd2dc"
            "$venv/bin/python" -m pip install -e . --no-deps
            "$venv/bin/python" scripts/run_gate_6d2_candidate.py \
              --candidate-id timesfm_2_5_zero_shot \
              --staging-root "$STAGING"
            rm -rf "$venv" "$STAGING/model_cache/timesfm_2_5_zero_shot"
          }

          run_moirai() {
            local venv="$STAGING/venv-moirai"
            create_common_environment "$venv"
            "$venv/bin/python" -m pip install \
              --index-url https://download.pytorch.org/whl/cpu \
              "torch==2.4.1"
            "$venv/bin/python" -m pip install \
              "numpy==1.26.4" \
              "pandas==2.1.4" \
              "pyarrow==18.1.0" \
              "scipy==1.11.4" \
              "lightning==2.4.0" \
              "gluonts==0.14.4" \
              "einops==0.7.0" \
              "jaxtyping==0.2.36" \
              "python-dotenv==1.0.1" \
              "hydra-core==1.3.2" \
              "orjson==3.10.12" \
              "tensorboard==2.18.0" \
              "multiprocess==0.70.16"
            "$venv/bin/python" -m pip install --no-deps \
              "git+https://github.com/SalesforceAIResearch/uni2ts.git@cfd46d4510ed8896f263116f32928eede05b0a75"
            "$venv/bin/python" -m pip install -e . --no-deps
            "$venv/bin/python" scripts/run_gate_6d2_candidate.py \
              --candidate-id moirai_2_research_zero_shot \
              --staging-root "$STAGING"
            rm -rf "$venv" "$STAGING/model_cache/moirai_2_research_zero_shot"
          }

          run_chronos
          run_timesfm
          run_moirai
          python scripts/build_gate_6d2_evidence.py --staging-root "$STAGING"

      - name: Upload bounded execution diagnostic
        if: failure() && steps.execute.outputs.executed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gate-6d2-execution-diagnostic
          path: ${{ runner.temp }}/gate_6d2_execution.log
          if-no-files-found: error
          retention-days: 14

      - name: Validate complete Gate 6D2 evidence
        run: |
          python scripts/validate_gate_6d2_evidence.py
          python scripts/verify_v1_immutability.py
          python scripts/audit_public_content.py

      - name: Publish governed foundation-model summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          import pandas as pd

          root = Path("outputs/v2/gate_6d")
          results = pd.read_csv(root / "candidate_results.csv")
          recommendation = json.loads(
              (root / "promotion_recommendation.json").read_text(encoding="utf-8")
          )
          manifest = json.loads(
              (root / "gate_6d_execution_manifest.json").read_text(encoding="utf-8")
          )
          print("## Gate 6D2 governed foundation-model validation")
          print()
          print("| Candidate | Mean MAE | Mean peak MAE | MAE improvement | Peak change | Positive folds | Commercial | Eligible |")
          print("|---|---:|---:|---:|---:|---:|---|---|")
          for row in results.itertuples(index=False):
              print(
                  f"| {row.candidate_id} | {row.mean_mae:.6f} | "
                  f"{row.mean_peak_mae:.6f} | "
                  f"{row.relative_mae_improvement_vs_v1:.2%} | "
                  f"{row.relative_peak_mae_change_vs_v1:.2%} | "
                  f"{row.positive_outer_folds} | "
                  f"{bool(row.commercial_use_eligible)} | "
                  f"{row.candidate_id in recommendation['eligible_candidates']} |"
              )
          print()
          print(f"Prediction rows: `{manifest['prediction_row_count']}`")
          print(f"Eligible candidates: `{recommendation['eligible_candidates']}`")
          print(f"Next gate: `{manifest['next_gate']}`")
          print()
          print("Validation evidence only. Human promotion authority remains required.")
          PY

      - name: Commit first Gate 6D2 evidence to pull-request branch
        if: steps.execute.outputs.executed == 'true' && github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/v2/gate_6d
          git commit -m "Record Gate 6D2 foundation-model validation evidence"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Upload complete Gate 6D2 evidence package
        uses: actions/upload-artifact@v4
        with:
          name: gate-6d2-governed-foundation-validation
          path: outputs/v2/gate_6d
          if-no-files-found: error
          retention-days: 90
