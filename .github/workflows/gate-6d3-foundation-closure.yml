name: Validate Gate 6D3 foundation-model closure

on:
  pull_request:
    paths:
      - ".github/workflows/gate-6d3-foundation-closure.yml"
      - "schemas/gate_6d3_human_decision.schema.json"
      - "schemas/gate_6d_closure_manifest.schema.json"
      - "outputs/v2/gate_6d/promotion_decision.json"
      - "outputs/v2/gate_6d/gate_6d_closure_manifest.json"
      - "scripts/validate_gate_6d3_closure.py"
      - "tests/test_gate_6d3_closure.py"
      - "docs/GATE_6D3_FOUNDATION_MODEL_CLOSURE.md"
      - "docs/ROADMAP.md"
      - "docs/DECISION_GATES.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure:
    name: Governed foundation-model rejection and closure
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Validate Gate 6D closure and immutable boundaries
        id: validate
        shell: bash
        run: |
          set +e
          DIAGNOSTIC="${RUNNER_TEMP}/gate_6d3_validation.log"
          (
            set -e
            python -m ruff --version
            python -m ruff check src scripts tests
            python scripts/verify_v1_immutability.py
            python scripts/validate_gate_6b_closure.py
            python scripts/validate_gate_6c3_closure.py
            python scripts/validate_gate_6d1.py
            python scripts/validate_gate_6d2_evidence.py
            python scripts/validate_gate_6d3_closure.py
            python -m pytest \
              tests/test_contracts.py \
              tests/test_v2_governance.py \
              tests/test_gate_6c3_closure.py \
              tests/test_foundation_model_governance.py \
              tests/test_gate_6d2_foundation_execution.py \
              tests/test_gate_6d3_closure.py \
              -q
            python scripts/audit_public_content.py
          ) > "$DIAGNOSTIC" 2>&1
          status=$?
          cat "$DIAGNOSTIC"
          exit "$status"

      - name: Upload bounded closure diagnostic
        if: failure() && steps.validate.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gate-6d3-closure-diagnostic
          path: ${{ runner.temp }}/gate_6d3_validation.log
          if-no-files-found: error
          retention-days: 14

      - name: Publish Gate 6D closure summary
        shell: bash
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Gate 6D3 foundation-model closure

          - Chronos-2: rejected
          - TimesFM 2.5: rejected
          - Moirai 2.0: rejected for promotion; retained only as a research negative benchmark
          - Retained model: `v1_frozen_champion`
          - Locked-test access: `false`
          - Confirmatory evaluation: `false`
          - Calibration performed: `false`
          - V1 immutable: `true`
          - Gate 6D status: `closed`
          - Next permitted gate: `6E`
          - Gates 6F and 6G: `blocked`
          EOF
