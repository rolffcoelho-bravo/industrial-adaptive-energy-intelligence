name: Validate Gate 6E1 uncertainty contract

on:
  pull_request:
    paths:
      - ".github/workflows/gate-6e1-uncertainty-contract.yml"
      - "configs/uncertainty_contract.yml"
      - "schemas/uncertainty_contract.schema.json"
      - "schemas/gate_6e1_closure_manifest.schema.json"
      - "outputs/v2/gate_6e1_closure_manifest.json"
      - "src/iaei/uncertainty_contracts.py"
      - "src/iaei/modeling/uncertainty_governance.py"
      - "scripts/validate_gate_6e1.py"
      - "tests/test_uncertainty_governance.py"
      - "docs/GATE_6E_UNCERTAINTY_PROTOCOL.md"
      - "docs/GATE_6E1_SCOPE_LOCK.md"
      - "docs/ROADMAP.md"
      - "docs/DECISION_GATES.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Governed uncertainty contract and execution boundary
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Validate Gate 6E1 contract and immutable boundaries
        id: validate
        shell: bash
        run: |
          set +e
          DIAGNOSTIC="${RUNNER_TEMP}/gate_6e1_validation.log"
          (
            set -e
            python -m ruff --version
            python -m ruff check src scripts tests
            python scripts/verify_v1_immutability.py
            python scripts/validate_gate_6d3_closure.py
            python scripts/validate_gate_6e1.py
            python -m pytest \
              tests/test_contracts.py \
              tests/test_v2_governance.py \
              tests/test_gate_6d3_closure.py \
              tests/test_uncertainty_governance.py \
              -q
            python scripts/audit_public_content.py
          ) > "$DIAGNOSTIC" 2>&1
          status=$?
          cat "$DIAGNOSTIC"
          exit "$status"

      - name: Upload bounded contract diagnostic
        if: failure() && steps.validate.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gate-6e1-contract-diagnostic
          path: ${{ runner.temp }}/gate_6e1_validation.log
          if-no-files-found: error
          retention-days: 14

      - name: Publish Gate 6E1 summary
        shell: bash
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Gate 6E1 uncertainty contract lock

          - Retained point model: `v1_frozen_champion`
          - Admissible methods: `3`
          - Frozen configurations: `9`
          - Coverage levels: `0.80`, `0.90`, `0.95`
          - Point-model search: `false`
          - Calibration performed: `false`
          - Intervals generated: `false`
          - Locked-test access: `false`
          - V1 immutable: `true`
          - Next gate: `6E2`, separate approval required
          - Gates 6E2, 6E3, 6F, and 6G: `blocked`
          EOF
