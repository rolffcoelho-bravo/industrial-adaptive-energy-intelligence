name: Diagnose Gate 6E2 V1 runtime compatibility

on:
  pull_request:
    paths:
      - ".github/workflows/gate-6e2-runtime-diagnostic.yml"
      - "src/iaei/v2/point_prediction_reconstruction.py"
      - "scripts/diagnose_gate_6e2_runtime.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: scikit-learn ${{ matrix.sklearn }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sklearn: ["1.6.1", "1.7.0", "1.7.1", "1.7.2", "1.8.0", "1.9.0"]
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONHASHSEED: "20260725"

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install runtime candidate
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"
          python -m pip install --force-reinstall "scikit-learn==${{ matrix.sklearn }}"

      - name: Prepare governed data
        run: |
          python scripts/download_data.py --verify
          python scripts/run_pipeline.py --silver

      - name: Record bounded compatibility evidence
        shell: bash
        run: |
          set +e
          DIAGNOSTIC="${RUNNER_TEMP}/sklearn-${{ matrix.sklearn }}.json"
          python scripts/diagnose_gate_6e2_runtime.py > "$DIAGNOSTIC" 2>&1
          status=$?
          echo "diagnostic_exit_status=${status}" >> "$DIAGNOSTIC"
          cat "$DIAGNOSTIC"
          exit 0

      - name: Upload runtime diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: gate-6e2-sklearn-${{ matrix.sklearn }}
          path: ${{ runner.temp }}/sklearn-${{ matrix.sklearn }}.json
          if-no-files-found: error
          retention-days: 14
