name: Execute Gate 6E2 governed uncertainty calibration

on:
  pull_request:
    paths:
      - ".github/workflows/gate-6e2-uncertainty-execution.yml"
      - "configs/uncertainty_contract.yml"
      - "schemas/gate_6e_execution_manifest.schema.json"
      - "schemas/uncertainty_*.schema.json"
      - "src/iaei/v2/point_prediction_reconstruction.py"
      - "src/iaei/v2/uncertainty_*.py"
      - "scripts/reconstruct_gate_6e2_point_predictions.py"
      - "scripts/run_gate_6e2_uncertainty.py"
      - "scripts/validate_gate_6e2_evidence.py"
      - "tests/test_gate_6e2_uncertainty_execution.py"
      - "outputs/v2/gate_6e/**"
      - "docs/GATE_6E2_*.md"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gate-6e2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  execute:
    name: Chronology-safe conformal uncertainty execution
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONHASHSEED: "20260725"
      CUDA_VISIBLE_DEVICES: ""

    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install governed execution environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Validate implementation and frozen predecessors
        id: preflight
        shell: bash
        run: |
          set +e
          DIAGNOSTIC="${RUNNER_TEMP}/gate_6e2_preflight.log"
          (
            set -e
            python -m ruff check src scripts tests
            python scripts/verify_v1_immutability.py
            python scripts/validate_gate_6d3_closure.py
            python scripts/validate_gate_6e1.py
            python scripts/validate_gate_6e2_evidence.py --allow-absent
            python -m pytest \
              tests/test_contracts.py \
              tests/test_v2_governance.py \
              tests/test_gate_6d3_closure.py \
              tests/test_uncertainty_governance.py \
              tests/test_gate_6e2_uncertainty_execution.py \
              -q
            python scripts/audit_public_content.py
          ) > "$DIAGNOSTIC" 2>&1
          status=$?
          cat "$DIAGNOSTIC"
          exit "$status"

      - name: Upload bounded preflight diagnostic
        if: failure() && steps.preflight.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gate-6e2-preflight-diagnostic
          path: ${{ runner.temp }}/gate_6e2_preflight.log
          if-no-files-found: error
          retention-days: 14

      - name: Prepare governed analytical data
        run: |
          python scripts/download_data.py --verify
          python scripts/run_pipeline.py --silver

      - name: Materialize frozen validation point predictions
        id: reconstruct
        shell: bash
        run: |
          set +e
          DIAGNOSTIC="${RUNNER_TEMP}/gate_6e2_reconstruction.log"
          python scripts/reconstruct_gate_6e2_point_predictions.py \
            > "$DIAGNOSTIC" 2>&1
          status=$?
          cat "$DIAGNOSTIC"
          exit "$status"

      - name: Upload bounded reconstruction diagnostic
        if: failure() && steps.reconstruct.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gate-6e2-reconstruction-diagnostic
          path: ${{ runner.temp }}/gate_6e2_reconstruction.log
          if-no-files-found: error
          retention-days: 14

      - name: Execute Gate 6E2 when evidence is absent
        id: execute
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="outputs/v2/gate_6e/gate_6e_execution_manifest.json"
          DIAGNOSTIC="${RUNNER_TEMP}/gate_6e2_execution.log"
          if [ -f "$MANIFEST" ]; then
            echo "executed=false" >> "$GITHUB_OUTPUT"
            echo "Committed Gate 6E2 evidence already exists. Execution skipped."
            exit 0
          fi
          echo "executed=true" >> "$GITHUB_OUTPUT"
          exec > >(tee "$DIAGNOSTIC") 2>&1
          python scripts/run_gate_6e2_uncertainty.py

      - name: Upload bounded execution diagnostic
        if: failure() && steps.execute.outputs.executed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gate-6e2-execution-diagnostic
          path: ${{ runner.temp }}/gate_6e2_execution.log
          if-no-files-found: error
          retention-days: 14

      - name: Validate complete Gate 6E2 evidence
        run: |
          python scripts/validate_gate_6e2_evidence.py
          python scripts/verify_v1_immutability.py
          python scripts/audit_public_content.py

      - name: Publish governed uncertainty summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          import pandas as pd

          root = Path("outputs/v2/gate_6e")
          results = pd.read_csv(root / "configuration_results.csv")
          recommendation = json.loads(
              (root / "promotion_recommendation.json").read_text(encoding="utf-8")
          )
          manifest = json.loads(
              (root / "gate_6e_execution_manifest.json").read_text(encoding="utf-8")
          )
          print("## Gate 6E2 governed uncertainty calibration")
          print()
          print("| Configuration | WIS | Peak WIS | 90% coverage | 90% width | Hard constraints |")
          print("|---|---:|---:|---:|---:|---|")
          for row in results.sort_values("weighted_interval_score").itertuples(index=False):
              print(
                  f"| {row.configuration_id} | {row.weighted_interval_score:.6f} | "
                  f"{row.peak_state_weighted_interval_score:.6f} | "
                  f"{row.empirical_coverage_90:.4f} | "
                  f"{row.mean_interval_width_kwh_at_90:.6f} | "
                  f"{bool(row.hard_constraints_passed)} |"
              )
          print()
          print(f"Interval rows: `{manifest['interval_prediction_row_count']}`")
          print(f"Outcome: `{recommendation['outcome']}`")
          print(f"Recommended: `{recommendation['recommended_configuration']}`")
          print(f"Next gate: `{manifest['next_gate']}`, authorized: `false`")
          print()
          print("Validation evidence only. Gate 6E3 human authority remains required.")
          PY

      - name: Commit first Gate 6E2 evidence to pull-request branch
        if: steps.execute.outputs.executed == 'true' && github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/v2/gate_6e docs/GATE_6E2_EXECUTION_RESULTS.md
          git commit -m "Record Gate 6E2 governed uncertainty evidence"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Upload complete Gate 6E2 evidence package
        uses: actions/upload-artifact@v4
        with:
          name: gate-6e2-governed-uncertainty-evidence
          path: outputs/v2/gate_6e
          if-no-files-found: error
          retention-days: 90
