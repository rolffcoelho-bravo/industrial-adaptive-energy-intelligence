name: Publish frozen V1 release

on:
  pull_request:
    paths:
      - ".github/workflows/publish-v1-release.yml"
      - "outputs/v1_release_manifest.json"
      - "schemas/v1_release_manifest.schema.json"
      - "docs/GATE_5E_V1_RELEASE_CLOSURE.md"
      - "docs/releases/V1.0.0.md"
      - "tests/test_v1_release_closure.py"
      - "src/iaei/contracts.py"
      - "pyproject.toml"
      - "README.md"
      - "docs/DECISION_GATES.md"
      - "docs/ROADMAP.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v1-release.yml"
      - "outputs/v1_release_manifest.json"
      - "schemas/v1_release_manifest.schema.json"
      - "docs/GATE_5E_V1_RELEASE_CLOSURE.md"
      - "docs/releases/V1.0.0.md"
      - "tests/test_v1_release_closure.py"
      - "src/iaei/contracts.py"
      - "pyproject.toml"
      - "README.md"
      - "docs/DECISION_GATES.md"
      - "docs/ROADMAP.md"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-v1-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate frozen V1 release candidate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Validate Gate 5E contracts and tests
        run: |
          python -m ruff check src/iaei/contracts.py tests/test_v1_release_closure.py
          python -m pytest tests/test_contracts.py tests/test_reporting_closure.py tests/test_v1_release_closure.py -q
          python scripts/audit_public_content.py

      - name: Verify release ancestry and governed identities
        shell: bash
        run: |
          set -euo pipefail
          BASE="91039533930b66743909b2b9674d79bbb15ec841"
          git merge-base --is-ancestor "$BASE" HEAD
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          root = Path(".")
          release = json.loads(
              (root / "outputs/v1_release_manifest.json").read_text(encoding="utf-8")
          )
          reporting = json.loads(
              (root / "outputs/reporting_closure_manifest.json").read_text(encoding="utf-8")
          )

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          assert release["status"] == "closed"
          assert release["tag"] == "v1.0.0"
          assert release["release_version"] == "1.0.0"
          assert release["next_gate"] == "6A"

          brief = release["canonical_assets"]["technical_brief"]
          canonical = reporting["canonical_pdf"]
          assert brief["sha256"] == canonical["sha256"]
          assert brief["size_bytes"] == canonical["size_bytes"]

          evidence = release["governed_evidence"]
          for key in ("report_payload", "latex_source"):
              item = evidence[key]
              assert sha256(root / item["path"]) == item["sha256"]

          for group in ("figures", "tables"):
              for path, expected in evidence[group].items():
                  assert sha256(root / path) == expected

          print("Gate 5E governed identities: PASS")
          PY

      - name: Retrieve and verify approved canonical PDF
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v1-release
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/artifacts/8621498159/zip" \
            > /tmp/approved-report.zip
          unzip -p \
            /tmp/approved-report.zip \
            reports/latex/industrial_adaptive_energy_intelligence_technical_brief.pdf \
            > /tmp/v1-release/industrial_adaptive_energy_intelligence_technical_brief.pdf
          echo "35e331e0349e0afca4aa8695a3f4aeafeffa18f83cdd9420876662bc6c782ba3  /tmp/v1-release/industrial_adaptive_energy_intelligence_technical_brief.pdf" \
            | sha256sum --check --strict
          test "$(stat -c%s /tmp/v1-release/industrial_adaptive_energy_intelligence_technical_brief.pdf)" -eq 1218669

      - name: Prepare exact release assets
        shell: bash
        run: |
          set -euo pipefail
          cp outputs/v1_release_manifest.json /tmp/v1-release/v1_release_manifest.json
          cp outputs/reporting_closure_manifest.json /tmp/v1-release/reporting_closure_manifest.json
          cp reports/latex/industrial_adaptive_energy_intelligence_technical_brief.tex \
            /tmp/v1-release/industrial_adaptive_energy_intelligence_technical_brief.tex
          cp docs/releases/V1.0.0.md /tmp/v1-release/V1.0.0.md
          (
            cd /tmp/v1-release
            sha256sum \
              industrial_adaptive_energy_intelligence_technical_brief.pdf \
              v1_release_manifest.json \
              reporting_closure_manifest.json \
              industrial_adaptive_energy_intelligence_technical_brief.tex \
              V1.0.0.md \
              > v1_release_checksums.sha256
            sha256sum --check --strict v1_release_checksums.sha256
          )

      - name: Upload validated release candidate package
        uses: actions/upload-artifact@v4
        with:
          name: industrial-adaptive-energy-intelligence-v1-release-candidate
          path: /tmp/v1-release/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish immutable V1 GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.0
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Verifying without mutation."
          else
            gh release create "$TAG" \
              /tmp/v1-release/industrial_adaptive_energy_intelligence_technical_brief.pdf \
              /tmp/v1-release/v1_release_manifest.json \
              /tmp/v1-release/reporting_closure_manifest.json \
              /tmp/v1-release/industrial_adaptive_energy_intelligence_technical_brief.tex \
              /tmp/v1-release/V1.0.0.md \
              /tmp/v1-release/v1_release_checksums.sha256 \
              --target "$GITHUB_SHA" \
              --title "Industrial Adaptive Energy Intelligence v1.0.0" \
              --notes-file docs/releases/V1.0.0.md \
              --latest
          fi

          git fetch --tags --force
          test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"

          release_json="$(gh release view "$TAG" --json tagName,isDraft,isPrerelease,url,assets)"
          python - "$release_json" <<'PY'
          from __future__ import annotations

          import json
          import sys

          release = json.loads(sys.argv[1])
          expected = {
              "industrial_adaptive_energy_intelligence_technical_brief.pdf",
              "v1_release_manifest.json",
              "reporting_closure_manifest.json",
              "industrial_adaptive_energy_intelligence_technical_brief.tex",
              "V1.0.0.md",
              "v1_release_checksums.sha256",
          }
          observed = {asset["name"] for asset in release["assets"]}

          assert release["tagName"] == "v1.0.0"
          assert release["isDraft"] is False
          assert release["isPrerelease"] is False
          assert observed == expected, (observed, expected)
          print(release["url"])
          PY

          rm -rf /tmp/v1-release-verify
          mkdir -p /tmp/v1-release-verify
          gh release download "$TAG" --dir /tmp/v1-release-verify
          (
            cd /tmp/v1-release-verify
            sha256sum --check --strict v1_release_checksums.sha256
          )

          echo "Gate 5E V1 release publication and asset verification: PASS"
