name: Verify frozen V1 release

on:
  pull_request:
    paths:
      - ".github/workflows/verify-v1-release.yml"
      - "docs/GATE_5E_RELEASE_VERIFICATION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify published V1 tag and assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release metadata and immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.0
          EXPECTED_COMMIT: 9e8cfe567d2174639675cbc784f21fe968dafe92
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          test "$(git rev-list -n 1 "$TAG")" = "$EXPECTED_COMMIT"

          release_json="$(gh release view "$TAG" --json tagName,isDraft,isPrerelease,url,assets)"
          python - "$release_json" <<'PY'
          from __future__ import annotations

          import json
          import sys

          release = json.loads(sys.argv[1])
          expected_assets = {
              "industrial_adaptive_energy_intelligence_technical_brief.pdf",
              "v1_release_manifest.json",
              "reporting_closure_manifest.json",
              "industrial_adaptive_energy_intelligence_technical_brief.tex",
              "V1.0.0.md",
              "v1_release_checksums.sha256",
          }
          observed_assets = {asset["name"] for asset in release["assets"]}

          assert release["tagName"] == "v1.0.0"
          assert release["isDraft"] is False
          assert release["isPrerelease"] is False
          assert observed_assets == expected_assets, (
              observed_assets,
              expected_assets,
          )
          print(release["url"])
          PY

      - name: Download and verify every release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.0
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v1-release-verify
          mkdir -p /tmp/v1-release-verify
          gh release download "$TAG" --dir /tmp/v1-release-verify
          (
            cd /tmp/v1-release-verify
            sha256sum --check --strict v1_release_checksums.sha256
            echo "35e331e0349e0afca4aa8695a3f4aeafeffa18f83cdd9420876662bc6c782ba3  industrial_adaptive_energy_intelligence_technical_brief.pdf" \
              | sha256sum --check --strict
            test "$(stat -c%s industrial_adaptive_energy_intelligence_technical_brief.pdf)" -eq 1218669
          )

      - name: Validate published release manifests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path("/tmp/v1-release-verify")
          release = json.loads(
              (root / "v1_release_manifest.json").read_text(encoding="utf-8")
          )
          reporting = json.loads(
              (root / "reporting_closure_manifest.json").read_text(
                  encoding="utf-8"
              )
          )

          assert release["gate"] == "5E"
          assert release["status"] == "closed"
          assert release["release_version"] == "1.0.0"
          assert release["tag"] == "v1.0.0"
          assert release["next_gate"] == "6A"
          assert release["release_controls"]["v1_mutable"] is False
          assert release["release_controls"]["asset_overwrite_permitted"] is False

          canonical = reporting["canonical_pdf"]
          technical_brief = release["canonical_assets"]["technical_brief"]
          assert technical_brief["sha256"] == canonical["sha256"]
          assert technical_brief["size_bytes"] == canonical["size_bytes"]

          print("Gate 5E published V1 release verification: PASS")
          PY
