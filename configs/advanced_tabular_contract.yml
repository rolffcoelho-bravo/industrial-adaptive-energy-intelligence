contract_version: "1.0.0"
gate: "6B"
status: approved_for_execution
execution_name: governed_advanced_tabular_challengers

v1_boundary:
  immutable_tag: v1.0.0
  immutable_commit: 9e8cfe567d2174639675cbc784f21fe968dafe92
  locked_test_access_permitted: false
  locked_prediction_parsing_permitted: false
  confirmatory_evaluation_permitted: false

data_boundary:
  silver_path: data/processed/steel_energy_silver.parquet
  outer_folds_path: outputs/modeling/chronological_folds.json
  incumbent_results_path: outputs/modeling/hist_gradient_boosting_validation_results.csv
  model_contract_path: configs/model_contract.yml
  target_contract_path: configs/target_contract.yml
  admissible_partitions:
    - training
    - validation
  outer_fold_count: 4
  inner_fold_count: 3
  purge_intervals: 4
  maximum_prediction_origin_exclusive: 28028
  maximum_target_dependency_exclusive: 28032

search:
  strategy: prespecified_nested_chronological_search
  scoring: mean_absolute_error
  unique_configuration_count: 12
  max_parallel_trials: 3
  max_retries_per_trial: 1
  max_wall_clock_minutes: 360
  deterministic_seed: 20260725
  internal_early_stopping_permitted: false
  refit_selected_configuration_on_outer_training: true

candidate_families:
  - algorithm_id: xgboost_hist
    library: xgboost
    search_space_path: configs/search_spaces/gate_6b_xgboost_hist.json
    configuration_count: 4
    objective: reg:absoluteerror
    configurations:
      - configuration_id: xgb_01
        n_estimators: 200
        learning_rate: 0.05
        max_depth: 4
        min_child_weight: 5.0
        subsample: 0.9
        colsample_bytree: 0.9
        reg_lambda: 1.0
        reg_alpha: 0.0
      - configuration_id: xgb_02
        n_estimators: 300
        learning_rate: 0.03
        max_depth: 5
        min_child_weight: 5.0
        subsample: 0.9
        colsample_bytree: 1.0
        reg_lambda: 2.0
        reg_alpha: 0.0
      - configuration_id: xgb_03
        n_estimators: 250
        learning_rate: 0.05
        max_depth: 6
        min_child_weight: 10.0
        subsample: 1.0
        colsample_bytree: 0.8
        reg_lambda: 5.0
        reg_alpha: 0.1
      - configuration_id: xgb_04
        n_estimators: 400
        learning_rate: 0.02
        max_depth: 4
        min_child_weight: 10.0
        subsample: 1.0
        colsample_bytree: 1.0
        reg_lambda: 10.0
        reg_alpha: 0.1

  - algorithm_id: lightgbm_l1
    library: lightgbm
    search_space_path: configs/search_spaces/gate_6b_lightgbm_l1.json
    configuration_count: 4
    objective: l1
    configurations:
      - configuration_id: lgbm_01
        n_estimators: 200
        learning_rate: 0.05
        num_leaves: 31
        min_child_samples: 20
        subsample: 0.9
        colsample_bytree: 0.9
        reg_lambda: 1.0
        reg_alpha: 0.0
      - configuration_id: lgbm_02
        n_estimators: 300
        learning_rate: 0.03
        num_leaves: 31
        min_child_samples: 40
        subsample: 1.0
        colsample_bytree: 0.8
        reg_lambda: 2.0
        reg_alpha: 0.0
      - configuration_id: lgbm_03
        n_estimators: 250
        learning_rate: 0.05
        num_leaves: 63
        min_child_samples: 40
        subsample: 0.9
        colsample_bytree: 1.0
        reg_lambda: 5.0
        reg_alpha: 0.1
      - configuration_id: lgbm_04
        n_estimators: 400
        learning_rate: 0.02
        num_leaves: 31
        min_child_samples: 80
        subsample: 1.0
        colsample_bytree: 1.0
        reg_lambda: 10.0
        reg_alpha: 0.1

  - algorithm_id: catboost_mae
    library: catboost
    search_space_path: configs/search_spaces/gate_6b_catboost_mae.json
    configuration_count: 4
    objective: MAE
    configurations:
      - configuration_id: cat_01
        iterations: 200
        learning_rate: 0.05
        depth: 6
        l2_leaf_reg: 3.0
        random_strength: 0.0
      - configuration_id: cat_02
        iterations: 300
        learning_rate: 0.03
        depth: 7
        l2_leaf_reg: 5.0
        random_strength: 0.0
      - configuration_id: cat_03
        iterations: 250
        learning_rate: 0.05
        depth: 8
        l2_leaf_reg: 10.0
        random_strength: 0.5
      - configuration_id: cat_04
        iterations: 400
        learning_rate: 0.02
        depth: 6
        l2_leaf_reg: 10.0
        random_strength: 0.5

objectives:
  primary: aggregate_mae
  robustness: peak_state_mae
  stability: temporal_fold_dispersion
  efficiency:
    - model_size_bytes
    - p95_inference_latency_ms_per_1000_rows
  portability: portability_failure_count

promotion:
  reference_id: v1_frozen_champion
  minimum_mean_validation_mae_relative_improvement: 0.01
  minimum_positive_outer_folds: 3
  maximum_single_fold_mae_relative_degradation: 0.02
  maximum_peak_state_mae_relative_degradation: 0.01
  hard_constraints_all_pass_required: true
  pareto_eligible_required: true
  automatic_promotion_permitted: false
  final_authority: human

outputs:
  directory: outputs/v2/gate_6b
  inner_search_results: inner_search_results.csv
  outer_fold_results: outer_fold_results.csv
  out_of_fold_predictions: out_of_fold_predictions.parquet
  candidate_leaderboard: candidate_leaderboard.csv
  trial_evidence: trial_evidence.json
  execution_manifest: gate_6b_execution_manifest.json
  promotion_recommendation: promotion_recommendation.json
  promotion_decision: promotion_decision.json
  closure_manifest: gate_6b_closure_manifest.json

claim_controls:
  production_claim_permitted: false
  savings_claim_permitted: false
  drift_claim_permitted: false
  causal_claim_permitted: false
  confirmatory_claim_permitted: false
  provisional_validation_language_required: true

next_gate: "6C"
