contract_version: 1.0.0
gate: 6E
subgate: 6E1
status: closed
uncertainty_name: governed_conformal_uncertainty_layer
point_model_boundary:
  model_id: v1_frozen_champion
  selected_model: hist_gradient_boosting
  release_tag: v1.0.0
  selected_model_manifest: outputs/modeling/selected_model_manifest.json
  candidate_manifest: outputs/modeling/hist_gradient_boosting_candidate_manifest.json
  outer_fold_predictions: outputs/modeling/hist_gradient_boosting_out_of_fold_predictions.parquet
