  point_model_search_permitted: false
  point_prediction_mutation_permitted: false
  point_prediction_parity_required: true
  point_prediction_parity_absolute_tolerance: 1.0e-12
evidence_boundary:
  admissible_partitions:
  - training
  - validation
  silver_path: data/processed/silver/energy_silver.parquet
  chronological_folds_path: outputs/modeling/chronological_folds.json
  target_contract_path: configs/target_contract.yml
  outer_fold_count: 4
  inner_fold_count: 3
  purge_intervals: 4
  validation_origin_count: 7004
  maximum_prediction_origin_exclusive: 28028
  maximum_target_dependency_exclusive: 28032
  locked_test_start: 28032
  locked_test_partition_permitted: false
  locked_prediction_parsing_permitted: false
  confirmatory_evaluation_permitted: false
  random_split_permitted: false
  full_sample_calibration_permitted: false
calibration_protocol:
  separate_from_point_fit: true
  residual_score: absolute_error
  inner_oof_residuals_required: true
  in_sample_residuals_permitted: false
  calibration_tail_fraction: 0.15
  minimum_calibration_origins: 672
  finite_sample_quantile_rule: ceil_n_plus_1_one_minus_alpha_higher
  target_coverage_levels:
  - 0.8
  - 0.9
  - 0.95
  primary_coverage_level: 0.9
  central_intervals: true
  lower_support_bound_kwh: 0.0
  support_clipping_applied_uniformly: true
  raw_bounds_recorded: true
  sequential_updates_permitted: true
  update_information_rule: revealed_targets_strictly_before_current_target
  maximum_update_target_dependency_offset: 0
  first_outer_origin_uses_training_only_residuals: true
  intervals_nested_required: true
candidate_families:
- method_id: expanding_absolute_conformal
  role: reference
  description: Expanding absolute-residual conformal intervals with sequentially revealed residual updates.
  configurations:
  - configuration_id: expanding_all
    window_intervals: null
    adaptive_gamma: null
- method_id: rolling_absolute_conformal
  role: challenger
  description: Fixed trailing-window absolute-residual conformal intervals.
  configurations:
  - configuration_id: rolling_672
    window_intervals: 672
    adaptive_gamma: null
  - configuration_id: rolling_2688
    window_intervals: 2688
    adaptive_gamma: null
- method_id: adaptive_absolute_conformal
  role: challenger
  description: Adaptive conformal inference using absolute residuals and bounded sequential alpha updates.
  adaptive_alpha_lower_bound: 0.001
  adaptive_alpha_upper_bound: 0.5
  configurations:
  - configuration_id: aci_672_0p005
    window_intervals: 672
    adaptive_gamma: 0.005
  - configuration_id: aci_672_0p01
    window_intervals: 672
    adaptive_gamma: 0.01
  - configuration_id: aci_672_0p02
    window_intervals: 672
    adaptive_gamma: 0.02
  - configuration_id: aci_2688_0p005
    window_intervals: 2688
    adaptive_gamma: 0.005
  - configuration_id: aci_2688_0p01
    window_intervals: 2688
    adaptive_gamma: 0.01
  - configuration_id: aci_2688_0p02
    window_intervals: 2688
    adaptive_gamma: 0.02
excluded_methods:
- method: conformalized_quantile_regression
  reason: Requires new quantile-model fitting and would reopen predictive-model selection.
- method: ensemble_batch_prediction_intervals
  reason: Requires bootstrap ensemble refitting and belongs to a separately authorized ensemble design.
- method: foundation_model_native_quantiles
  reason: Gate 6D quantiles are diagnostic, uncalibrated, and tied to rejected point challengers.
- method: parametric_gaussian_intervals
  reason: Unsupported residual-distribution assumptions are outside the approved distribution-free layer.
metrics:
  required_by_coverage_level:
  - empirical_coverage
  - absolute_coverage_error
  - mean_interval_width_kwh
  - normalized_mean_interval_width
  - interval_score
  - peak_state_coverage
  - peak_state_mean_interval_width_kwh
  - peak_state_interval_score
  aggregate_required:
  - weighted_interval_score
  - peak_state_weighted_interval_score
  - maximum_outer_fold_absolute_coverage_error
  - maximum_rolling_672_absolute_coverage_error
  - longest_consecutive_miss_run
  - interval_nesting_violation_count
  - support_floor_activation_rate
  - point_prediction_parity_violation_count
  - chronology_violation_count
  - nonfinite_evidence_count
  - p95_latency_ms_per_1000_rows
  - peak_memory_mb
  - artifact_size_bytes
  - deterministic_replay_passed
  - cpu_portability_passed
  normalization:
    width_denominator: outer_training_target_iqr
    zero_iqr_behavior: fail_closed
  weighted_interval_score_levels:
